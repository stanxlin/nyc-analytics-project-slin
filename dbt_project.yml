name: 'group15'
version: '1.0.0'
config-version: 2
# Some default settings for dbt
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
 - "target"
 - "dbt_packages"

# Set up models, which are basically SQL files, to create tables
models:
 group15:
   +materialized: table

   project_work:
     staging:
       +materialized: table
       +schema: group_15_staging

     marts:
       +materialized: table
       +schema: group_15_marts

       conformed:
         +materialized: table

       traffic_signal_requests:
         +materialized: table